[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-text-input-oracle"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub==1.7.1",
  "jinja2==3.1.6",
  "pydantic==2.12.5",
  "tokenizers==0.22.2",
  "tiktoken==0.12.0",
  "transformers==5.13.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
data = ["pyarrow==21.0.0"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
